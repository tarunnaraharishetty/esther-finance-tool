[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esther"
version = "0.1.0"
description = "Terminal-based AI trading dashboard and research assistant built on Alpaca."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Esther Finance" }]
keywords = ["trading", "alpaca", "sentiment", "dashboard", "research"]

dependencies = [
    "alpaca-py>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "websockets>=12.0",
    "httpx>=0.27",
    "rich>=13.7",
    "textual>=0.70",
    "click>=8.1",
    "sqlalchemy>=2.0",
    "transformers>=4.42",
    "torch>=2.3",
    "anthropic>=0.55",
    "structlog>=24.1",
    "tenacity>=8.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "ipython>=8.25",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
esther = "src.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "logs", "models"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",
    "ASYNC",
    "PTH",           # use pathlib
]
ignore = [
    "E501",          # line length — handled by formatter
    # The dashboard prose deliberately uses typographic Unicode (× for
    # counts, – / − for ranges and minus signs). Allow them in
    # strings, docstrings, and comments rather than ASCII-flatten the
    # output style.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use bare `pytest.raises(Exception)` when the only
# guarantee they want to assert is "something blew up here" — narrowing
# would over-couple to implementation details that are explicitly
# free to change.
"tests/**" = ["B017"]
# main.py loads heavy third-party modules (anthropic, alpaca, transformers)
# inside the per-command click handlers so that `esther --help` and
# unrelated commands stay fast. The lazy-import pattern is deliberate
# rather than a sign of tangled dependencies.
"src/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["build/", "dist/", "data/", "logs/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing -m 'not integration and not slow'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: hits real external services (run with `pytest -m integration`)",
    "slow: downloads models or otherwise long-running (run with `pytest -m slow`)",
]
