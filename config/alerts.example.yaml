# Alert rules for the Esther dashboard. Copy to alerts.yaml and customise.
# Loaded by `esther dashboard` at startup. Missing file = use built-in defaults.
#
# Each entry is a rule object. `type` is required; remaining keys are passed
# to the rule constructor verbatim. Severity controls dashboard styling
# (info=cyan, warn=yellow, critical=red+bell).
#
# Available rule types:
#
#   action_changed         Fires when BUY/HOLD/SELL flips between ticks.
#                          severity (default: warn)
#
#   confidence_threshold   Fires when confidence crosses `threshold` in
#                          either direction since the last tick.
#                          threshold (default: 0.6)
#                          severity  (default: info)
#
#   sentiment_shift        Fires when avg news sentiment moves by at least
#                          `delta` since the last tick.
#                          delta    (default: 0.4)
#                          severity (default: info)
#
#   tier_changed           Fires when the 5-tier recommendation shifts
#                          within the same base action (e.g. BUY -> STRONG BUY,
#                          STRONG_SELL -> SELL). Cross-action flips are
#                          covered by `action_changed`, so this rule never
#                          double-alerts.
#                          severity (default: info)

# Snapshot rules operate on the whole watchlist each tick rather than
# one row at a time. They're the right fit for cross-row signals (e.g.
# "this symbol just entered the top-N ranked opportunities"). Omit the
# `snapshot_rules:` block entirely to keep the built-in defaults.
#
# Available snapshot rule types:
#
#   opportunity_entry      Fires when a symbol newly enters the top-N
#                          ranked OPPORTUNITIES (composite-score top list).
#                          Quiet on the first tick (no baseline) and on
#                          stable membership tick-over-tick.
#                          n              (default: 3)
#                          min_composite  (default: 0.30)
#                          severity       (default: info)

snapshot_rules:
  - type: opportunity_entry
    n: 3
    min_composite: 0.30
    severity: info

rules:
  # Any recommendation flip — most actionable signal for a discretionary trader.
  - type: action_changed
    severity: warn

  # Confidence pushing through the action threshold — usually arrives just
  # before / after a flip.
  - type: confidence_threshold
    threshold: 0.6
    severity: info

  # Hard threshold — ring the bell.
  - type: confidence_threshold
    threshold: 0.85
    severity: critical

  # Big swings in news sentiment regardless of price movement.
  - type: sentiment_shift
    delta: 0.4
    severity: info

  # Tier promotions/demotions within the same base action — e.g.,
  # BUY -> STRONG BUY when the four STRONG gates all light up.
  - type: tier_changed
    severity: info

# ---------------------------------------------------------------------------
# Prioritizer — applied AFTER the rules above produce their raw firings.
# Optional. If this block is omitted entirely, sensible defaults are used:
#   - action_changed never debounces (a real flip is information)
#   - confidence_threshold: 5 min cooldown to silence boundary oscillation
#   - sentiment_shift: 10 min cooldown (sentiment moves slowly)
#   - no composites, no per-tick cap
# ---------------------------------------------------------------------------

prioritizer:
  cooldowns:
    # Per-rule debounce in seconds. Same (symbol, rule) suppressed within window.
    confidence_threshold: 300
    sentiment_shift: 600
    tier_changed: 300
    # Opportunities can shuffle through the top-N as composite scores
    # bounce; 10 min cooldown keeps the alert focused on durable changes.
    opportunity_entry: 600

  composites:
    # When ALL `requires` rules fire for the same symbol in the same tick,
    # emit ONE composite alert and suppress its constituents.
    #
    # ORDER MATTERS: composites are matched top-down and the first match
    # consumes its constituents. List MORE-SPECIFIC composites first so
    # they have a chance to fire before less-specific ones absorb their
    # constituents. The triple-confirmation block goes ahead of the
    # pair composites for that reason.

    # Triple confirmation — fresh OPP, action flip, AND sentiment swing
    # in the same tick. The strongest possible read: a name just turned,
    # the news flow turned with it, and the engine ranked it into the
    # top-N opportunity list as a result.
    - name: opp_flip_with_sentiment
      requires: [opportunity_entry, action_changed, sentiment_shift]
      severity: critical
      message: "{symbol}: fresh top-N opportunity from a flip + sentiment swing"

    # OPP entry born from a fresh action flip — high-conviction event,
    # ring the bell. Pairs cleanly with the burst-refresh path so the
    # follow-up tick lands quickly.
    - name: fresh_opp_from_flip
      requires: [opportunity_entry, action_changed]
      severity: critical
      message: "{symbol}: fresh top-N opportunity from an action flip"

    # OPP entry born from a big news-sentiment swing. Different mechanism
    # than the flip composite (sentiment-led, not price-led) — worth a
    # warn so the trader sees it without the bell going off every time.
    - name: fresh_opp_from_sentiment_swing
      requires: [opportunity_entry, sentiment_shift]
      severity: warn
      message: "{symbol}: fresh top-N opportunity on a sentiment swing"

    # OPP entry alongside a same-action tier shift (BUY -> STRONG BUY,
    # STRONG_SELL -> SELL). Signals that the existing direction
    # strengthened or weakened enough to push a ranking move.
    - name: fresh_opp_from_tier_shift
      requires: [opportunity_entry, tier_changed]
      severity: warn
      message: "{symbol}: fresh top-N opportunity from a tier shift"

    # Existing pair composite (no opportunity_entry involved) — preserved
    # so users upgrading to this version of the example don't lose it.
    - name: high_conviction_reversal
      requires: [action_changed, sentiment_shift]
      severity: critical
      message: "{symbol}: action flip + sentiment swing in same tick"

  # Optional: cap alerts per tick after sort. Omit for no cap.
  # max_per_tick: 10
