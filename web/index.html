<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Esther — live trading dashboard</title>
    <meta
      name="description"
      content="AI market intelligence workstation for discretionary traders. Decision-support, not execution."
    />

    <!-- Open Graph / Twitter card metadata. Same string for both so
         shares to Slack / Discord / Twitter all render consistently.
         No og:image yet — would need a hosted PNG; favicon.svg is
         enough for v1. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Esther — live trading dashboard" />
    <meta
      property="og:description"
      content="AI market intelligence workstation for discretionary traders. Decision-support, not execution."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Esther — live trading dashboard" />
    <meta
      name="twitter:description"
      content="AI market intelligence workstation for discretionary traders. Decision-support, not execution."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
